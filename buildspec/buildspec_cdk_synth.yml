version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing CDK and dependencies..."
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Synthesizing CDK app..."
      - cdk synth MyMainInfrastructureStack

artifacts:
  base-directory: cdk.out
  files:
    - '**/*'
