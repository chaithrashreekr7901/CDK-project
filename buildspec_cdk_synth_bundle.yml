version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - echo "Installing AWS CDK..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies..."
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Synthesizing the CDK app..."
      - cdk synth MyMainInfrastructureStack --output cdk.out

  build:
  commands:
    - echo "Bundling application artifacts..."
    - mkdir -p app_bundle # Staging directory for the bundle content
    - |
      if [ -d "application_source" ]; then
        cp -r application_source/* app_bundle/
      else
        echo "Warning: 'application_source' directory not found."
      fi
    - |
      if [ -f "appspec.yml" ]; then # If appspec.yml is at the root
        cp appspec.yml app_bundle/
      elif [ -f "application_source/appspec.yml" ]; then # If appspec.yml is in application_source
        # Already copied if application_source was copied, or cp application_source/appspec.yml app_bundle/
        echo "appspec.yml found in application_source and copied."
      else
        echo "Error: appspec.yml not found!"
        exit 1
      fi
    # You should then ZIP the contents of 'app_bundle' to create a single file artifact
    - echo "Zipping the app_bundle directory..."
    - (cd app_bundle && zip -r ../app_bundle.zip .) # Creates app_bundle.zip in the parent (root)

artifacts:
  # Primary artifact (for CdkTemplatesOutput)
  files:
    - '**/*'
  base-directory: 'cdk.out'
  # Secondary artifact (for AppBundleOutput)
  secondary-artifacts:
    AppBundleOutput:
      files:
        - app_bundle.zip
      base-directory: '.' # Since app_bundle.zip is created in the root