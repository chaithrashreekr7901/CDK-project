version: 0.2

phases:
  install:
    commands:
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  build:
    commands:
      - echo ">>> CDK Synth Phase for MyMainInfrastructureStack <<<"
      - cdk synth MyMainInfrastructureStack > output.yaml

artifacts:
  files:
    - output.yaml
