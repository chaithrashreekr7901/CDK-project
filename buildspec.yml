version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.11

    commands:
      - echo "--- INSTALL PHASE ---"
      - echo "Installing AWS CDK CLI globally..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies from root requirements.txt..."
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "--- PRE-BUILD PHASE ---"
      - echo "Verifying AWS CDK version..."
      - cdk --version
      - echo "Synthesizing the CDK app..."
      - cdk synth

  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - echo "Deploying CDK stacks without approval prompts..."
      - cdk deploy --require-approval never

  post_build:
    commands:
      - echo "--- POST-BUILD PHASE ---"
      - echo "Build and deployment completed successfully."

artifacts:
  files:
    - '**/*'
