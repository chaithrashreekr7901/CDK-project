version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
      nodejs: 18
    commands:
      - echo "--- INSTALL PHASE ---"
      - echo "Installing Node.js and AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies from requirements.txt in cdk_project/"
      - pip install -r cdk_project/requirements.txt
  pre_build:
    commands:
      - echo "--- PRE_BUILD PHASE ---"
      - cd cdk_project
      - echo "Attempting CDK bootstrap..."
      - cdk bootstrap
      - echo "CDK bootstrap finished."
      - ls -la
  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - cd cdk_project
      - echo "Synthesizing CDK stacks..."
      - cdk synth MyMainInfrastructureStack
  post_build:
    commands:
      - echo "--- POST_BUILD PHASE ---"
      - echo "Build completed on $(date)"
      - ls -la cdk_project/cdk.out
artifacts:
  base-directory: cdk_project/cdk.out
  files:
    - '**/*'
