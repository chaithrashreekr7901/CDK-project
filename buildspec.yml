version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
      nodejs: 18
    commands:
      - echo "--- INSTALL PHASE ---"
      - echo "Installing Node.js and AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Navigating to CDK project directory (assuming 'cdk_project' subdirectory)..."
      - cd cdk_project 
      - echo "Current directory after cd: $(pwd)"
      - echo "Installing Python dependencies from requirements.txt..."
      - pip install -r requirements.txt
  pre_build: # This might be around line 13 depending on editor/comments
    commands: # This might be around line 14
      - echo "--- PRE_BUILD PHASE ---" # Line 15
      - echo "Current directory: $(pwd)" # Line 16
      - echo "Listing files in current directory (should contain app.py, cdk.json):" # Line 17
      - ls -la
  build:
    commands:
      - echo "--- BUILD PHASE ---"
      # Ensure you are in the cdk_project directory if your cdk.json is there
      # The 'cd cdk_project' in the install phase should handle this for subsequent phases.
      - echo "Current directory before synth: $(pwd)" 
      - echo "Synthesizing CDK stacks..."
      - cdk synth MyMainInfrastructureStack 
  post_build:
    commands:
      - echo "--- POST_BUILD PHASE ---"
      - echo "Build completed on $(date)"
      - echo "Listing contents of cdk.out directory..."
      - ls -la cdk.out 
artifacts:
  base-directory: cdk_project/cdk.out 
  files:
    - '**/*'