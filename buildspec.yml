version: 0.2

phases:
  install:
    commands:
      - echo "--- INSTALL PHASE ---"
      - echo "Installing Node.js and AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies from requirements.txt at root level..."
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "--- PRE-BUILD PHASE ---"
      - echo "Synthesizing the CDK app..."
      - cdk synth

  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - echo "Deploying CDK stacks..."
      - cdk deploy --require-approval never

  post_build:
    commands:
      - echo "--- POST-BUILD PHASE ---"
      - echo "Build and deployment completed successfully."

artifacts:
  files:
    - '**/*'
