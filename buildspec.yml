version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
      nodejs: 20
    commands:
      - echo "--- INSTALL PHASE ---"
      - npm install -g aws-cdk
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "--- PRE_BUILD PHASE ---"
      - echo "Current directory: $(pwd)"
      - cdk bootstrap
      - ls -la

  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - echo "Synthesizing specific CDK stack: MyMainInfrastructureStack"
      - cdk synth MyMainInfrastructureStack

  post_build:
    commands:
      - echo "--- POST_BUILD PHASE ---"
      - echo "Build completed on $(date)"
      - ls -la cdk.out

artifacts:
  base-directory: cdk.out
  files:
    - '**/*'
