version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "--- INSTALL PHASE ---"
      - echo "Installing Node.js and AWS CDK CLI..."
      - npm install -g aws-cdk
      - echo "Installing Python dependencies from requirements.txt at root level..."
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "--- PRE-BUILD PHASE ---"
      - echo "Verifying CDK version..."
      - cdk --version

  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - echo "Synthesizing CloudFormation templates using CDK..."
      - cdk synth MyMainInfrastructureStack

  post_build:
    commands:
      - echo "--- POST-BUILD PHASE ---"
      - echo "Build phase complete. No deploy step included."

artifacts:
  files:
    - 'cdk.out/**/*'   # ✅ This line is updated to include synthesized templates
