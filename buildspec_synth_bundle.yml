version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing CDK and Python dependencies..."
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Synthesizing the CDK app..."
      - cdk synth MyMainInfrastructureStack

  build:
    commands:
      - echo "Bundling application artifacts..."
      - mkdir -p app_bundle
      - rsync -av --exclude='app_bundle' ./ app_bundle/

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  secondary-artifacts:
    AppBundleOutput:
      base-directory: app_bundle
      files:
        - '**/*'
    CdkTemplatesOutput:
      base-directory: cdk.out
      files:
        - '**/*'
