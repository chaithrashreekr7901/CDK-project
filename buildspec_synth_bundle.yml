version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing CDK globally"
      - npm install -g aws-cdk
      # Add other dependency installations for your CDK app if needed (e.g., pip install -r requirements.txt)

  pre_build:
    commands:
      - echo "Starting CDK synth and application bundling"

  build:
    commands:
      - echo "Running cdk synth..."
      - cdk synth # Output goes to cdk.out/ by default
      - echo "CDK synth complete."

      - echo "Creating application bundle (app_bundle.zip)..."
      - mkdir app_bundle_temp_dir # Temporary directory for bundling
      - |
        if [ -d "application_source" ]; then
          cp -r application_source/* app_bundle_temp_dir/
        else
          echo "Warning: 'application_source' directory not found."
        fi
      - |
        if [ -f "appspec.yml" ]; then
          cp appspec.yml app_bundle_temp_dir/
        else
          echo "Error: appspec.yml not found at the root. This is required for CodeDeploy."
          exit 1
        fi
      # Create the zip file in the root of the CodeBuild source directory
      # This will be picked up by the secondary artifact definition below.
      - (cd app_bundle_temp_dir && zip -r ../app_bundle.zip .)
      - echo "app_bundle.zip created successfully."
      # This buildspec NO LONGER uploads to S3 or creates bundle_location.json

  artifacts:
    # Primary Artifact (CDK Templates - maps to 'cdk_templates_artifact' in PipelineStack)
    # CodePipeline's CodeBuildAction maps the first item in its 'outputs' list to this primary artifact definition.
    files:
      - '**/*'
    base-directory: 'cdk.out' # All files and subdirectories from cdk.out

    # Secondary Artifact (Application Bundle - maps to 'application_bundle_artifact' in PipelineStack)
    # The 'identifier' here ('AppBundleOutput') MUST match the 'artifact_name' property
    # of the second codepipeline.Artifact object in the CodeBuildAction's 'outputs' list in PipelineStack.py.
    secondary-artifacts:
      AppBundleOutput: # This identifier matches application_bundle_artifact.artifact_name
        files:
          - app_bundle.zip # The zip file created in the build phase
        # base-directory: '.' # Assuming app_bundle.zip is in the root of the build environment
        name: ApplicationBundleArtifact_$(date +%Y-%m-%d_%H-%M-%S) # Optional: S3 artifact name formatting

  cache:
    paths:
      - '/root/.npm/**/*'
