version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - echo "Installing CDK and Python dependencies..."
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Synthesizing the CDK app..."
      - cdk synth MyMainInfrastructureStack

  build:
    commands:
      - echo "Deploying the CDK stack..."
      - cdk deploy MyMainInfrastructureStack --require-approval never --outputs-file cdk-deploy-outputs.json
      - echo "Bundling application artifacts..."
      - mkdir -p app_bundle
      - rsync -av --exclude='app_bundle' ./ app_bundle/

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - cdk-deploy-outputs.json
  secondary-artifacts:
    AppBundleOutput:
      base-directory: app_bundle
      files:
        - '**/*'
    CdkTemplatesOutput:
      base-directory: cdk.out
      files:
        - '**/*'
cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.cache/pip/**/*'
