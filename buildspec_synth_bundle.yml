version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Synthesizing the CDK stack..."
      - cdk synth MyMainInfrastructureStack

  build:
    commands:
      - echo "Bundling application artifacts..."
      - mkdir -p app_bundle
      - cp -r flask_app/* app_bundle/

artifacts:
  files:
    - '**/*'
  base-directory: app_bundle
