<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 1.2em;
        }
        .version {
            margin-top: 20px;
            font-size: 0.9em;
            color: #777;
        }
        .instance-info {
            margin-top: 20px;
            font-size: 0.85em;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from CodeDeploy!</h1>
        <p>This is a simple web application deployed via AWS CodePipeline and CodeDeploy.</p>
        <p>Your deployment is working!</p>
        <div class="version">
            Application Version: 1.0.0
        </div>
        <div class="instance-info">
            <h2>Instance Details:</h2>
            <p><strong>Instance ID:</strong> <span id="instance-id">Loading...</span></p>
            <p><strong>Instance Name:</strong> <span id="instance-name">Loading...</span></p>
            <p><strong>Availability Zone:</strong> <span id="instance-az">Loading...</span></p>
        </div>
    </div>

    <script>
        async function fetchInstanceMetadata() {
            let token = '';
            try {
                // Step 1: Get an IMDSv2 session token
                const tokenResponse = await fetch('http://169.254.169.254/latest/api/token', {
                    method: 'PUT',
                    headers: {
                        'X-aws-ec2-metadata-token-ttl-seconds': '21600' // Token valid for 6 hours
                    }
                });
                token = await tokenResponse.text();

                if (!tokenResponse.ok) {
                    throw new Error(`Failed to get IMDS token: ${tokenResponse.status} ${tokenResponse.statusText}`);
                }

                const headers = { 'X-aws-ec2-metadata-token': token };

                // Step 2: Fetch Instance ID
                const instanceIdResponse = await fetch('http://169.254.169.254/latest/meta-data/instance-id', { headers });
                const instanceId = await instanceIdResponse.text();
                document.getElementById('instance-id').textContent = instanceId;

                // Step 3: Fetch Availability Zone
                const azResponse = await fetch('http://169.254.169.254/latest/meta-data/placement/availability-zone', { headers });
                const az = await azResponse.text();
                document.getElementById('instance-az').textContent = az;

                // Step 4: Fetch Instance Name (from hostname)
                const hostnameResponse = await fetch('http://169.254.169.254/latest/meta-data/hostname', { headers });
                const hostname = await hostnameResponse.text();
                // Often hostname is instance_name.domain.tld, so splitting might give the name
                document.getElementById('instance-name').textContent = hostname.split('.')[0];
                
            } catch (error) {
                console.error('Error fetching instance metadata (IMDSv2 likely needed/failed):', error);
                document.getElementById('instance-id').textContent = 'N/A (Error or not EC2 - check IMDSv2)';
                document.getElementById('instance-name').textContent = 'N/A (Error or not EC2 - check IMDSv2)';
                document.getElementById('instance-az').textContent = 'N/A (Error or not EC2 - check IMDSv2)';
            }
        }

        // Call the function when the page loads
        document.addEventListener('DOMContentLoaded', fetchInstanceMetadata);
    </script>
</body>
</html>
