<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 1.2em;
        }
        .version {
            margin-top: 20px;
            font-size: 0.9em;
            color: #777;
        }
        .instance-info {
            margin-top: 20px;
            font-size: 0.85em;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from CodeDeploy!</h1>
        <p>This is a simple web application deployed via AWS CodePipeline and CodeDeploy.</p>
        <p>Your deployment is working!</p>
        <div class="version">
            Application Version: 1.0.0
        </div>
        <div class="instance-info">
            <h2>Instance Details:</h2>
            <p><strong>Instance ID:</strong> <span id="instance-id">Loading...</span></p>
            <p><strong>Instance Name:</strong> <span id="instance-name">Loading...</span></p>
            <p><strong>Availability Zone:</strong> <span id="instance-az">Loading...</span></p>
        </div>
    </div>

    <script src="instance_info.js"></script>
    <script>
        // Populate instance details using the data from instance_info.js
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof INSTANCE_DETAILS !== 'undefined') {
                document.getElementById('instance-id').textContent = INSTANCE_DETAILS.id;
                document.getElementById('instance-name').textContent = INSTANCE_DETAILS.name;
                document.getElementById('instance-az').textContent = INSTANCE_DETAILS.az;
            } else {
                console.error('INSTANCE_DETAILS not found. instance_info.js might not have loaded or generated correctly.');
                document.getElementById('instance-id').textContent = 'N/A (Data Missing)';
                document.getElementById('instance-name').textContent = 'N/A (Data Missing)';
                document.getElementById('instance-az').textContent = 'N/A (Data Missing)';
            }
        });
    </script>
</body>
</html>
