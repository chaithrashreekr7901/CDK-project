<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 1.2em;
        }
        .version {
            margin-top: 20px;
            font-size: 0.9em;
            color: #777;
        }
        /* The .instance-info style is no longer used but is kept for reference if needed */
        .instance-info {
            margin-top: 20px;
            font-size: 0.85em;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from CodeDeploy!</h1>
        <p>This is a simple web application deployed via AWS CodePipeline and CodeDeploy.</p>
        <p>Your deployment is working!</p>
        <div class="version">
            Application Version: 1.0.0
        </div>
        
        </div>

    </body>
</html>
